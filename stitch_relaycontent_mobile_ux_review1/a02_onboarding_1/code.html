<div class="inline-flex items-center gap-1.5 h-5 px-1.5 rounded bg-primary-container/10 border border-primary/20">
<span class="w-1.5 h-1.5 rounded-full bg-primary animate-pulse"></span>

</div>
<!-- Secondary Skip Action -->

</header>

<span class="font-code-telemetry text-code-telemetry text-on-surface-variant tracking-wider">SKU #4892</span>
</div>
<div class="flex items-center gap-1 text-tertiary">
<span class="w-1.5 h-1.5 rounded-full bg-tertiary"></span>
<span class="font-body-sm text-body-sm text-tertiary font-medium">พร้อมจำหน่าย</span>
</div>
</div>

</div>

        </p>
