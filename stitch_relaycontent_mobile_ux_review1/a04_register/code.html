<body class="bg-[#070b12] text-on-surface antialiased flex items-center justify-center min-h-screen p-0 sm:p-4">
<!-- Mobile Viewport Container: 390x844 strict logical viewport -->
<main class="w-[390px] h-[844px] max-w-[390px] bg-background border border-outline-variant/30 rounded-none sm:rounded-2xl shadow-2xl relative flex flex-col justify-between p-6 overflow-y-auto no-scrollbar">
<!-- Top Block: Header, Single Telemetry Tag & Title -->
<div>
<!-- Top Brand Header with Telemetry Signal (One instance per screen rule) -->
<div class="flex items-center justify-between pt-1 pb-4">
<div class="flex items-center gap-2">
<div class="w-8 h-8 rounded-lg bg-surface-container-high border border-outline-variant/40 flex items-center justify-center text-primary">
<span class="material-symbols-outlined text-[18px]">hub</span>
</div>
<span class="text-headline-sm font-headline-sm font-bold text-on-surface tracking-tight">RelayContent</span>
</div>
<!-- Max 1 Telemetry Micro-tag per screen -->
<div class="h-5 px-2 bg-primary-container/10 border border-primary-container/30 rounded flex items-center gap-1.5">
<span class="w-1.5 h-1.5 rounded-full bg-primary animate-pulse"></span>
<span class="text-code-telemetry font-code-telemetry text-primary">AUTH: READY</span>
</div>
</div>
<!-- Section Title & Subtitle -->
<div class="mt-2 mb-5">
<h1 class="text-headline-lg font-headline-lg text-on-surface tracking-tight mb-1">
          สร้างบัญชีผู้ใช้ใหม่
        </h1>
<p class="text-body-sm font-body-sm text-on-surface-variant">
          ศูนย์ควบคุมคอนเทนต์และจัดการแคมเปญสำหรับครีเอเตอร์
        </p>
</div>
<!-- Registration Form -->
<form class="space-y-3.5" id="register-form" onsubmit="event.preventDefault();">
<!-- 1. ชื่อที่ใช้แสดง (Display Name) -->
<div class="space-y-1">
<label class="block text-label-sm font-label-sm text-on-surface-variant" for="displayName">
            ชื่อที่ใช้แสดง
          </label>
<div class="relative flex items-center">
<input class="w-full h-11 px-3 bg-surface-container border border-outline-variant rounded-lg text-body-md font-body-md text-on-surface placeholder:text-outline focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors" id="displayName" placeholder="เช่น Somchai Creator" required="" type="text"/>
<span class="material-symbols-outlined absolute right-3 text-outline text-[18px] pointer-events-none">
              badge
            </span>
</div>
</div>
<!-- 2. อีเมล (Email) -->
<div class="space-y-1">
<label class="block text-label-sm font-label-sm text-on-surface-variant" for="emailInput">
            อีเมล
          </label>
<div class="relative flex items-center">
<input class="w-full h-11 px-3 bg-surface-container border border-outline-variant rounded-lg text-body-md font-code-telemetry text-on-surface placeholder:text-outline focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors" id="emailInput" placeholder="name@example.com" required="" type="email"/>
<span class="material-symbols-outlined absolute right-3 text-outline text-[18px] pointer-events-none">
              mail
            </span>
</div>
</div>
<!-- 3. รหัสผ่าน (Password) -->
<div class="space-y-1">
<label class="block text-label-sm font-label-sm text-on-surface-variant" for="passwordInput">
            รหัสผ่าน
          </label>
<div class="relative flex items-center">
<input class="w-full h-11 px-3 pr-10 bg-surface-container border border-outline-variant rounded-lg text-body-md font-body-md text-on-surface placeholder:text-outline focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors" id="passwordInput" minlength="8" placeholder="อย่างน้อย 8 ตัวอักษร" required="" type="password"/>
<button aria-label="แสดงหรือซ่อนรหัสผ่าน" class="absolute right-3 text-outline hover:text-on-surface focus:outline-none flex items-center" id="togglePassword" type="button">
<span class="material-symbols-outlined text-[18px]" id="eyeIcon">visibility</span>
</button>
</div>
</div>
<!-- Helper Note: TikTok OAuth context -->
<div class="flex items-start gap-2 py-1.5 px-3 rounded-lg bg-surface-container-lowest border border-outline-variant/30">
<span class="material-symbols-outlined text-primary text-[16px] mt-0.5 shrink-0">info</span>
<p class="text-body-sm font-body-sm text-on-surface-variant leading-relaxed">
            เชื่อมต่อบัญชี TikTok ผ่านระบบ OAuth ในขั้นตอนถัดไป
          </p>
</div>
<!-- 4. Terms and Privacy Policy Checkbox -->
<div class="pt-0.5">
<label class="flex items-start gap-2.5 cursor-pointer select-none">
<input class="w-4 h-4 mt-0.5 rounded border-outline-variant bg-surface-container text-primary focus:ring-primary focus:ring-offset-background" id="termsCheckbox" required="" type="checkbox"/>
<span class="text-body-sm font-body-sm text-on-surface-variant leading-tight">
              ยอมรับ<a class="text-primary hover:underline ml-0.5" href="#">เงื่อนไขการใช้งาน</a> และ <a class="text-primary hover:underline" href="#">นโยบายความเป็นส่วนตัว</a>
</span>
</label>
</div>
<!-- 5. ปุ่ม 'สร้างบัญชีผู้ใช้' (Create Account) -->
<div class="pt-1">
<button class="w-full h-12 bg-secondary-container hover:bg-[#c9003c] text-white rounded-lg text-body-md font-headline-sm font-semibold flex items-center justify-center gap-2 active:scale-[0.98] transition-all shadow-[0_4px_16px_rgba(181,0,54,0.35)]" type="submit">
<span>สร้างบัญชีผู้ใช้</span>
<span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</div>
</form>
<!-- Divider / Or Section -->
<div class="relative flex items-center justify-center my-4">
<div class="border-t border-outline-variant/50 w-full"></div>
<span class="bg-background px-3 text-label-sm font-label-sm text-outline shrink-0">หรือ</span>
<div class="border-t border-outline-variant/50 w-full"></div>
</div>
<!-- 6. ตัวเลือกสมัครด้วย Google -->
<button class="w-full h-11 bg-surface-container hover:bg-surface-container-high border border-outline-variant rounded-lg flex items-center justify-center gap-2.5 text-on-surface text-label-md font-label-md active:scale-[0.98] transition-all" type="button">
<svg class="w-4 h-4 shrink-0" viewbox="0 0 24 24">
<path d="M12 5c1.6 0 3 .6 4.1 1.7l3.1-3.1C17.3 1.8 14.8 1 12 1 7.4 1 3.5 3.6 1.6 7.4l3.7 2.9C6.2 7.3 8.9 5 12 5z" fill="#EA4335"></path>
<path d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.6h6.5c-.3 1.5-1.1 2.8-2.4 3.7l3.7 2.9c2.2-2 3.7-5 3.7-8.9z" fill="#4285F4"></path>
<path d="M5.3 14.7c-.2-.7-.4-1.5-.4-2.3s.2-1.6.4-2.3L1.6 7.2C.6 9.2 0 11.5 0 14.4s.6 5.2 1.6 7.2l3.7-2.9z" fill="#FBBC05"></path>
<path d="M12 23.8c3.2 0 6-1.1 8-3l-3.7-2.9c-1.1.7-2.5 1.2-4.3 1.2-3.1 0-5.8-2.3-6.7-5.3L1.6 16.7C3.5 20.5 7.4 23.8 12 23.8z" fill="#34A853"></path>
</svg>
<span>สมัครด้วยบัญชี Google</span>
</button>
</div>
<!-- Bottom Link: 'มีบัญชีอยู่แล้ว? เข้าสู่ระบบ' -->
<div class="pt-3 pb-1 text-center border-t border-outline-variant/30 mt-3">
<p class="text-body-sm font-body-sm text-on-surface-variant">
        มีบัญชีอยู่แล้ว? 
        <a class="text-primary font-medium hover:underline ml-1" href="#">
          เข้าสู่ระบบ
        </a>
</p>
</div>
</main>
<!-- Interactive script for password reveal & UX response -->
<script>
    const togglePassword = document.getElementById('togglePassword');
    const passwordInput = document.getElementById('passwordInput');
    const eyeIcon = document.getElementById('eyeIcon');

    if (togglePassword && passwordInput && eyeIcon) {
      togglePassword.addEventListener('click', () => {
        const isPassword = passwordInput.getAttribute('type') === 'password';
        passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
        eyeIcon.textContent = isPassword ? 'visibility_off' : 'visibility';
      });
    }
  </script>
</body></html>
