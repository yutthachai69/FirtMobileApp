<body class="bg-surface-container-lowest text-on-surface antialiased min-h-screen flex items-center justify-center p-0 selection:bg-primary-container selection:text-on-primary-container">
<!-- Mobile Viewport 390x844 Shell -->
<main class="w-[390px] h-[844px] max-w-[390px] mx-auto bg-surface relative flex flex-col justify-between p-6 overflow-y-auto border border-outline-variant/30 shadow-2xl">
<!-- Atmospheric subtle ambient glow -->
<div class="absolute top-0 right-0 -mr-20 -mt-20 w-56 h-56 rounded-full bg-primary/5 blur-3xl pointer-events-none"></div>
<div class="absolute bottom-1/4 -left-20 w-48 h-48 rounded-full bg-secondary-container/10 blur-3xl pointer-events-none"></div>
<!-- Top Header & Telemetry Micro-Badge -->
<div class="relative z-10">
<header class="flex items-center justify-between pt-2 pb-6">
<div class="flex items-center gap-2">
<div class="w-8 h-8 rounded-lg bg-surface-container-high border border-outline-variant/60 flex items-center justify-center text-primary">
<span class="material-symbols-outlined text-[18px]">hub</span>
</div>
<span class="text-headline-sm font-headline-sm font-bold text-on-surface tracking-tight">RelayContent</span>
</div>
<!-- Strict Telemetry Constraint: Max 1 Micro-Tag per screen -->
<div class="h-[20px] px-[6px] rounded bg-primary-container/10 border border-primary/25 flex items-center gap-1.5">
<span class="w-1.5 h-1.5 rounded-full bg-primary animate-pulse"></span>
<span class="font-code-telemetry text-code-telemetry text-primary uppercase">SECURE AUTH</span>
</div>
</header>
<!-- Screen Title & Narrative Subtitle -->
<section class="mt-4 mb-6">
<h1 class="font-headline-lg text-headline-lg text-on-surface tracking-tight font-bold">เข้าสู่ระบบ</h1>
<p class="font-body-md text-body-md text-on-surface-variant mt-1.5 leading-relaxed">
          จัดการคอนเทนต์และระบบปักตะกร้าอัตโนมัติ
        </p>
</section>
<!-- Main Login Form -->
<form class="space-y-4" onsubmit="event.preventDefault();">
<!-- Email Input -->
<div class="space-y-1.5">
<label class="block font-label-md text-label-md text-on-surface" for="email-field">
            อีเมล
          </label>
<div class="relative flex items-center">
<input autocomplete="email" class="w-full h-12 px-3.5 rounded-lg bg-surface-container border border-outline-variant/60 text-on-surface placeholder:text-outline/70 font-code-telemetry text-[13px] focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors" id="email-field" placeholder="อีเมลของคุณ (เช่น user@example.com)" type="email"/>
</div>
</div>
<!-- Password Input -->
<div class="space-y-1.5">
<label class="block font-label-md text-label-md text-on-surface" for="password-field">
            รหัสผ่าน
          </label>
<div class="relative flex items-center">
<input autocomplete="current-password" class="w-full h-12 pl-3.5 pr-11 rounded-lg bg-surface-container border border-outline-variant/60 text-on-surface placeholder:text-outline/70 font-code-telemetry text-[13px] focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors tracking-wide" id="password-field" placeholder="รหัสผ่าน" type="password"/>
<button aria-label="สลับการมองเห็นรหัสผ่าน" class="absolute right-3 p-1 rounded text-on-surface-variant hover:text-on-surface transition-colors flex items-center justify-center" id="toggle-password" type="button">
<span class="material-symbols-outlined text-[20px]" id="eye-icon">visibility</span>
</button>
</div>
</div>
<!-- Options Row: Remember & Forgot -->
<div class="flex items-center justify-between pt-1 pb-1">
<label class="flex items-center gap-2 cursor-pointer select-none">
<input class="w-4 h-4 rounded bg-surface-container border border-outline-variant text-primary focus:ring-0 focus:ring-offset-0 transition-colors cursor-pointer" type="checkbox"/>
<span class="font-body-sm text-body-sm text-on-surface-variant">จดจำการเข้าสู่ระบบ</span>
</label>
<a class="font-body-sm text-body-sm text-primary hover:text-primary-fixed transition-colors font-medium" href="#A05">
            ลืมรหัสผ่าน?
          </a>
</div>
<!-- Primary CTA -->
<button class="w-full h-12 mt-2 rounded-lg bg-gradient-to-r from-secondary-container via-rose-600 to-primary-container text-white font-label-md text-label-md font-semibold tracking-wide shadow-lg shadow-rose-950/40 active:scale-[0.98] transition-transform flex items-center justify-center gap-2" type="submit">
<span>เข้าสู่ระบบ</span>
<span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</form>

<div class="relative my-6 flex items-center justify-center">

<div class="w-full border-t border-outline-variant/40"></div>

        </span>

<path d="M23.5 12.3c0-.8-.1-1.7-.2-2.3H12v4.5h6.5c-.3 1.5-1.1 2.8-2.4 3.7l3.7 2.9c2.2-2 3.7-5 3.7-8.8z" fill="#4285F4"></path>
<path d="M5.3 14.8c-.2-.7-.4-1.5-.4-2.8s.2-2.1.4-2.8L1.6 6.3C.6 8.3 0 10.6 0 12s.6 3.7 1.6 5.7l3.7-2.9z" fill="#FBBC05"></path>
<path d="M12 23c3.2 0 6-1.1 8-3l-3.7-2.9c-1.1.7-2.5 1.2-4.3 1.2-3.2 0-5.8-2.3-6.7-5.2L1.6 16c1.9 3.7 5.8 7 10.4 7z" fill="#34A853"></path>
</svg>
<span class="font-body-md text-body-md font-medium text-on-surface group-hover:text-primary transition-colors">

        ยังไม่มีบัญชี? 
        <a class="text-primary hover:text-primary-fixed font-medium ml-1 inline-flex items-center underline-offset-4 hover:underline" href="#register">
          สมัครสมาชิก
        </a>
</p>
</footer>
</main>
<script>
    // Password visibility toggle interaction
    const toggleBtn = document.getElementById('toggle-password');
    const passwordInput = document.getElementById('password-field');
    const eyeIcon = document.getElementById('eye-icon');

    if (toggleBtn && passwordInput && eyeIcon) {
      toggleBtn.addEventListener('click', () => {
        const isPassword = passwordInput.getAttribute('type') === 'password';
        passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
        eyeIcon.textContent = isPassword ? 'visibility_off' : 'visibility';
      });
    }
  </script>
